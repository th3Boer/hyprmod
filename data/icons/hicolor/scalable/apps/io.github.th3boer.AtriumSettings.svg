<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Atrium Settings: a gear on the shell's dark surface, accent ring -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2433"/>
      <stop offset="1" stop-color="#151219"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f06a8a"/>
      <stop offset="1" stop-color="#b04ad6"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <g transform="translate(64 64)">
    <g fill="url(#acc)">
      <rect x="-7" y="-40" width="14" height="16" rx="3"/>
      <rect x="-7" y="-40" width="14" height="16" rx="3" transform="rotate(45)"/>
      <rect x="-7" y="-40" width="14" height="16" rx="3" transform="rotate(90)"/>
      <rect x="-7" y="-40" width="14" height="16" rx="3" transform="rotate(135)"/>
      <rect x="-7" y="-40" width="14" height="16" rx="3" transform="rotate(180)"/>
      <rect x="-7" y="-40" width="14" height="16" rx="3" transform="rotate(225)"/>
      <rect x="-7" y="-40" width="14" height="16" rx="3" transform="rotate(270)"/>
      <rect x="-7" y="-40" width="14" height="16" rx="3" transform="rotate(315)"/>
      <circle r="28"/>
    </g>
    <circle r="12" fill="#151219"/>
  </g>
</svg>
